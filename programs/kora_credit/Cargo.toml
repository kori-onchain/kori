[package]
name = "kora_credit"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "kora_business/idl-build",
    "kora_pool/idl-build",
]

[lib]
crate-type = ["cdylib", "lib"]
name = "kora_credit"

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
kora_business = { path = "../kora_business", features = ["no-entrypoint"] }
kora_pool = { path = "../kora_pool", features = ["cpi"] }
