[package]
name = "kora_business"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "kora_pool/idl-build"]

[lib]
crate-type = ["cdylib", "lib"]
